version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # A Playwright upgrade also needs the CI image tag and digest (ADR-0024) and may need new
      # display snapshots (ADR-0018), so it gets a pull request of its own.
      playwright:
        patterns:
          - '@playwright/test'
          - 'playwright-core'
      npm-minor-and-patch:
        patterns:
          - '*'
        exclude-patterns:
          - '@playwright/test'
          - 'playwright-core'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Zurich
    commit-message:
      prefix: ci
    groups:
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
