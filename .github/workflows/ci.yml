# Quality gates for pull requests and main (§10): lint → types → unit tests with coverage → build
# and budgets → E2E on Chromium, Firefox and WebKit with axe → Lighthouse CI. Any failure blocks
# the merge: make "CI passed" the required status check of the main branch.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Where the site will live (C2). Defaults to the project site https://<owner>.github.io/<repo>/;
  # for a custom domain set the repository variables BASE_PATH=/, SITE_URL and PAGES_CNAME.
  BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
  PAGES_CNAME: ${{ vars.PAGES_CNAME }}
  # Playwright serves the downloaded build under the same path it was built for.
  E2E_BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

jobs:
  verify:
    name: Lint, types, unit tests, build and budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (LTS from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint (CSS module types, ESLint, Prettier)
        run: npm run lint

      - name: Unused files, exports and dependencies (knip)
        run: npm run lint:knip

      - name: Type-check
        run: npm run typecheck

      - name: Unit, property and component tests with coverage
        run: npm run test:coverage

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Check budgets
        run: npm run budgets

      - name: Remove the build manifest from the site
        run: rm -rf dist/.vite

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          # Keeps .nojekyll.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload the coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=chromium --project=visual
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (LTS from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Functional, accessibility, CSP and console checks
        run: npx playwright test ${{ matrix.projects }}

      - name: Input latency, display sync and endurance (one worker, no tracing)
        if: ${{ matrix.browser == 'chromium' }}
        run: npm run test:e2e:perf

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (LTS from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Download the site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - name: Lighthouse, mobile and desktop
        run: npm run lhci

      - name: Upload the Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  passed:
    name: CI passed
    if: ${{ always() }}
    needs: [verify, e2e, lighthouse]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate is green
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A quality gate did not pass ($result)."
              exit 1
            fi
          done
