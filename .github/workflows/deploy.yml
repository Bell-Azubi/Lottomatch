# Publishes the site that CI built and tested, after CI is green on main (§10). Nothing is rebuilt:
# the exact artifact that passed the gates goes live.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    # Only a green CI run of a push to main in this repository; never pull requests or forks.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Read the site artifact of the CI run.
      actions: read
      # Publish to Pages and prove the deployment's origin (OIDC).
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Download the tested site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check that the site was built for this Pages address
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          expected="url=${PAGES_URL%/}/\""
          if ! grep -qiF "$expected" dist/404.html; then
            echo "::error::The site was built for another address than ${PAGES_URL}. Set the repository variables BASE_PATH, SITE_URL and PAGES_CNAME as described in the README, then re-run CI."
            exit 1
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Keeps .nojekyll.
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
